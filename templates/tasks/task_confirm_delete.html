<!DOCTYPE html>
<html>
<head>
    <title>Delete Task - SmartTodo</title>
</head>
<body>

    <h1>Delete Task</h1>

    <p>Are you sure you want to delete "{{ task.title }}"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <br>

    <a href="{% url 'task_list' %}">Cancel</a>

</body>
</html>
